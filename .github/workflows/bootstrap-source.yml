name: Expand MarketAI source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bootstrap
        id: check
        shell: bash
        run: |
          if compgen -G '.bootstrap/core.part*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install zstd
        if: steps.check.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Rebuild source snapshot
        if: steps.check.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/core.part* | tr -d '\n\r' > /tmp/marketai-source.b64
          rem=$(( $(wc -c < /tmp/marketai-source.b64) % 4 ))
          if [ "$rem" -eq 2 ]; then printf '==' >> /tmp/marketai-source.b64; fi
          if [ "$rem" -eq 3 ]; then printf '=' >> /tmp/marketai-source.b64; fi
          if [ "$rem" -eq 1 ]; then echo 'Invalid Base64 snapshot length' >&2; exit 1; fi
          base64 --decode /tmp/marketai-source.b64 > /tmp/marketai-source.tar.zst
          zstd -t /tmp/marketai-source.tar.zst
          zstd -dc /tmp/marketai-source.tar.zst | tar -xf - -C .
          rm -rf .bootstrap

      - name: Commit expanded source
        if: steps.check.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'chore: expand MarketAI commercial source'
          git push
